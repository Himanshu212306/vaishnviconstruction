        .floating-bubbles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            opacity: 0.7;
        }

        .floating-bubble {
            position: absolute;
            bottom: -120px;
            width: 56px;
            height: 56px;
            border: 1px solid rgba(201, 130, 0, 0.22);
            border-radius: 9999px;
            background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.45), rgba(201, 130, 0, 0.08) 38%, rgba(16, 42, 67, 0.03) 70%);

            animation: bubble-rise 18s linear infinite;
        }

        .floating-bubble:nth-child(1) {
            left: 8%;
            animation-delay: -3s;
            transform: scale(0.75);
        }

        .floating-bubble:nth-child(2) {
            left: 24%;
            animation-delay: -11s;
            transform: scale(1.35);
        }

        .floating-bubble:nth-child(3) {
            left: 43%;

        }

        .floating-bubble:nth-child(4) {

            animation-delay: -15s;
            transform: scale(1.05);
        }

        .floating-bubble:nth-child(5) {
            left: 78%;
            animation-delay: -5s;
            transform: scale(0.7);
        }

        .floating-bubble:nth-child(6) {
            left: 92%;
            animation-delay: -13s;
            transform: scale(1.5);
        }

        @keyframes bubble-rise {
            0% {
                translate: 0 0;
                opacity: 0;
            }

            12% {
                opacity: 0.8;
            }

            50% {
                translate: 32px -50vh;
            }

            88% {
                opacity: 0.45;
            }

            100% {
                translate: -24px -115vh;
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .floating-bubble {
                animation: none;
                opacity: 0.25;
            }
        }

            const [projects, setProjects] = useState(() => {
                const savedProjects = localStorage.getItem('vaishnavi_projects');
                return savedProjects ? JSON.parse(savedProjects) : [

                        id: 1,
                        title: "Commercial Complex",
                        category: "Commercial",
                        status: "Ongoing",
                        image: "incompleted.jpeg"

                        title: "Luxury Villa Design",
                        category: "Residential",
                        status: "Completed",
                        image: "project2.jpeg"

            const saveProjects = (updatedProjects) => {
                return fetch(PROJECTS_API, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedProjects)
                }).then(response => {
                    if (!response.ok) throw new Error('Project save failed');
                    setProjects(updatedProjects);
                    localStorage.setItem('vaishnavi_projects', JSON.stringify(updatedProjects));
                    return response.json();
                });

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 40);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                fetch(PROJECTS_API)
                    .then(response => response.ok ? response.json() : Promise.reject())
                    .then(serverProjects => {
                        setProjects(serverProjects);
                        localStorage.setItem('vaishnavi_projects', JSON.stringify(serverProjects));
                    })

                localStorage.setItem('vaishnavi_enquiries', JSON.stringify(updatedEnquiries));

                    .then((result) => {
                        alert("Dhanyawad! Aapki enquiry save ho gayi hai.");
                        form.reset();

                    </main>

                    {/* Floating WhatsApp CTA */}
                    <a

                        aria-label="WhatsApp"

                    </a>

                    {/* Footer */}
                    <footer className="bg-navy-dark text-gray-300 py-12 border-t border-navy">
                        <div className="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                            <div>
                                <div className="flex items-center gap-2 mb-2">
                                    <img
                                        src="logo.png"
                                        alt="Logo"
                                        className="w-8 h-8 rounded-full border border-gold object-cover bg-white"
                                        onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }}

                                    <h3 className="text-white font-extrabold text-lg">VAISHNAVI CONSTRUCTION's</h3>

                                    <a href="https://www.linkedin.com/in/vaishnavi-construction-s-a458b142a" target="_blank" className="hover:text-gold"><i className="fab fa-linkedin"></i></a>

                                </div>

        // --- FULL ADMIN PORTAL MANAGEMENT COMPONENT ---
        function AdminPortalView({ enquiries, setEnquiries, projects, setProjects, saveProjects }) {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            // New Project Form State
            const [newProjTitle, setNewProjTitle] = useState('');
            const [newProjCategory, setNewProjCategory] = useState('Residential');
            const [newProjStatus, setNewProjStatus] = useState('Ongoing');
            const [newProjImage, setNewProjImage] = useState('');
            const [newProjImageName, setNewProjImageName] = useState('');

            // Admin Login Handler (Passcode: 12345)
            const handleLogin = (e) => {
                e.preventDefault();
                if (password === 'Vaishnavi@2025') {
                    setIsAuthenticated(true);
                    setLoginError('');
                } else {
                    setLoginError('Sahi password daalein! (Default Pass: 12345)');
                }
            };

            // Update Client Enquiry Status
            const handleStatusChange = (id, newStatus) => {
                const updated = enquiries.map(item => item.id === id ? { ...item, status: newStatus } : item);
                setEnquiries(updated);
                localStorage.setItem('vaishnavi_enquiries', JSON.stringify(updated));
            };

            // Delete Client Enquiry
            const handleDeleteEnquiry = (id) => {
                if (window.confirm("Kya aap is inquiry ko delete karna chahte hain?")) {
                    const updated = enquiries.filter(item => item.id !== id);
                    setEnquiries(updated);
                    localStorage.setItem('vaishnavi_enquiries', JSON.stringify(updated));
                }
            };

            // Add New Project
            const handleAddProject = (e) => {
                e.preventDefault();
                if (!newProjTitle) return;

                const newProj = {
                    id: Date.now(),
                    title: newProjTitle,
                    category: newProjCategory,
                    status: newProjStatus,
                    image: newProjImage || 'incompleted.jpeg'
                };

                const updatedProjects = [newProj, ...projects];
                saveProjects(updatedProjects)
                    .then(() => {
                        setNewProjTitle('');
                        setNewProjImage('');
                        setNewProjImageName('');
                        alert("Project Safaltapoorvak Add Ho Gaya!");
                    })
                    .catch(() => alert("Project save nahi ho paya. Vercel me MONGODB_URI check karein."));
            };

            const handleProjectImageChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    alert('Please select an image file.');
                    e.target.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = () => {
                    setNewProjImage(reader.result);
                    setNewProjImageName(file.name);
                };
                reader.readAsDataURL(file);
            };

            // Toggle Project Status
            const handleProjectStatusToggle = (id) => {
                const updated = projects.map(p => {
                    if (p.id === id) {
                        return { ...p, status: p.status === 'Ongoing' ? 'Completed' : 'Ongoing' };
                    }
                    return p;
                });
                saveProjects(updated).catch(() => alert("Status update nahi ho paya. Vercel me MONGODB_URI check karein."));
            };

            // Delete Project
            const handleDeleteProject = (id) => {
                if (window.confirm("Kya aap is project ko website se hatana chahte hain?")) {
                    const updated = projects.filter(p => p.id !== id);
                    saveProjects(updated).catch(() => alert("Project delete nahi ho paya. Vercel me MONGODB_URI check karein."));
                }
            };

            if (!isAuthenticated) {
                return (
                    <div className="max-w-md mx-auto my-8 px-4">
                        <div className="bg-white dark:bg-navy p-8 rounded-xl shadow-xl border border-gray-200 dark:border-gray-800 text-center">

                                <i className="fas fa-user-shield"></i>
                            </div>
                            <h2 className="text-2xl font-black mb-1">Admin Portal Access</h2>
                            <p className="text-xs text-gray-500 dark:text-gray-400 mb-6">Management authentication required</p>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <input
                                        type="password"
                                        placeholder="Enter Passcode (Default: 12345)"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full p-3 text-sm rounded bg-gray-50 dark:bg-navy-dark border border-gray-300 dark:border-gray-700 focus:outline-none focus:border-gold text-center font-mono"
                                        required
                                    />
                                </div>
                                {loginError && <p className="text-red-500 text-xs font-semibold">{loginError}</p>}
                                <button type="submit" className="w-full bg-gold hover:bg-gold-light text-navy-dark font-bold py-3 rounded shadow uppercase text-xs tracking-wider transition">
                                    Login to Admin Dashboard
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-7xl mx-auto px-4 py-12">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-gray-200 dark:border-gray-800 pb-4">
                        <div>
                            <span className="text-gold font-bold text-xs uppercase tracking-widest">Control Center</span>
                            <h2 className="text-3xl font-black">Admin Management Dashboard</h2>
                        </div>
                        <button onClick={() => setIsAuthenticated(false)} className="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded shadow transition flex items-center gap-2">
                            <i className="fas fa-sign-out-alt"></i> Logout Admin
                        </button>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* Section 1: Enquiries Table */}
                        <div className="lg:col-span-2 space-y-6">
                            <div className="bg-white dark:bg-navy p-6 rounded-xl shadow border border-gray-200 dark:border-gray-800">
                                <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
                                    <i className="fas fa-inbox text-gold"></i> Client Inquiries & Leads ({enquiries.length})
                                </h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-gray-100 dark:bg-navy-dark text-gray-500 dark:text-gray-400 uppercase">
                                            <tr>
                                                <th className="p-3">Client</th>
                                                <th className="p-3">Contact</th>
                                                <th className="p-3">Type</th>
                                                <th className="p-3">Location</th>
                                                <th className="p-3">Status</th>
                                                <th className="p-3 text-right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-200 dark:divide-gray-800">
                                            {enquiries.map(e => (
                                                <tr key={e.id} className="hover:bg-gray-50 dark:hover:bg-navy-dark/50">
                                                    <td className="p-3 font-bold">
                                                        {e.name}
                                                        <span className="block text-[10px] text-gray-400 font-normal">{e.date}</span>
                                                    </td>
                                                    <td className="p-3">
                                                        <a href={`tel:${e.phone}`} className="text-gold font-semibold hover:underline block">{e.phone}</a>
                                                        <span className="text-[10px] text-gray-400 block">{e.email}</span>
                                                    </td>
                                                    <td className="p-3"><span className="bg-gold/10 text-gold px-2 py-0.5 rounded font-bold">{e.project}</span></td>
                                                    <td className="p-3">{e.location}</td>
                                                    <td className="p-3">
                                                        <select
                                                            value={e.status}
                                                            onChange={(evt) => handleStatusChange(e.id, evt.target.value)}
